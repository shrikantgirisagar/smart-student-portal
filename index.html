<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <main id="loginPage" class="login-page">
    <div class="login-particles"></div>
    <div class="login-glow glow-a"></div>
    <div class="login-glow glow-b"></div>

    <div class="login-shapes">
      <div class="shape shape-a"></div>
      <div class="shape shape-b"></div>
      <div class="shape shape-c"></div>
      <div class="shape shape-d"></div>
    </div>

    <div class="login-objects" aria-hidden="true">
      <div class="obj obj-book">📚</div>
      <div class="obj obj-pencil">✏️</div>
      <div class="obj obj-laptop">💻</div>
      <div class="obj obj-cap">🎓</div>
      <div class="obj obj-star">⭐</div>
    </div>

    <section class="login-card">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
          <h1>Smart Student Portal</h1>
          <p>Secure Academic Management System</p>
        </div>
      </div>

      <div class="login-heading">
        <span>WELCOME BACK</span>
        <h2>Sign in to continue</h2>
        <p>Select your account type below.</p>
      </div>

      <div class="role-tabs">
        <button class="role-tab active" data-role="student"><span
            class="role-icon">🎓</span><span>Student</span></button>
        <button class="role-tab" data-role="faculty"><span class="role-icon">👨‍🏫</span><span>Faculty</span></button>
        <button class="role-tab" data-role="admin"><span class="role-icon">🛡️</span><span>Admin</span></button>
      </div>

      <form id="loginForm">
        <label for="username" id="loginUsernameLabel">Username</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input id="username" type="text" placeholder="Enter your username" required autocomplete="username">
        </div>

        <label for="password">Password</label>
        <div class="password-wrap">
          <span class="input-icon">🔒</span>
          <input id="password" type="password" placeholder="Enter your password" required
            autocomplete="current-password">
          <button type="button" id="togglePassword" class="eye-btn" aria-label="Show password" title="Show password">
            <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.2 12s3.5-6 9.8-6 9.8 6 9.8 6-3.5 6-9.8 6-9.8-6-9.8-6Z"></path>
              <circle cx="12" cy="12" r="2.7"></circle>
            </svg>
          </button>
        </div>
        <div class="forgot-row">
          <span class="forgot-text">Forgot Password?</span>
          <button type="button" id="forgotPasswordBtn" class="forgot-link">Click Here</button>
        </div>

        <button class="primary-btn" type="submit"><span>Sign In</span><span class="arrow">→</span></button>
        <p id="loginMessage" class="message"></p>
      </form>

      <div class="signup-divider"><span>New account?</span></div>
      <div class="signup-buttons">
        <button id="studentSignupBtn" class="signup-btn student-signup"><span>🎓</span> Student Signup</button>
        <button id="facultySignupBtn" class="signup-btn faculty-signup"><span>👨‍🏫</span> Faculty Signup</button>
      </div>
    </section>
  </main>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand"><span>🎓</span>
        <div><b>Smart Portal</b></div>
      </div>
      <nav id="sidebarNav"></nav>
      <button id="logoutBtn" class="logout-btn">↪ Logout</button>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

    <section class="main-area">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div><span id="pageEyebrow">Dashboard</span>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="topbar-actions">
          <button id="topbarNoticeBtn" class="topbar-notice-btn" title="View Campus Notices"
            aria-label="View Campus Notices">
            <span class="bell-icon">🔔</span>
            <span id="topbarNoticeBadge" class="notice-count-badge hidden">0</span>
          </button>
          <div class="user-chip"><span id="userAvatar">S</span>
            <div><b id="userName">Student</b><small id="userRole">Student</small></div>
          </div>
        </div>
      </header>
      <div id="content" class="content"></div>
    </section>
  </div>

  <script src="database.js"></script>
  <script src="script.js"></script>
</body>

</html>
